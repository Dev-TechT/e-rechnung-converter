[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrechnung-converter"
version = "0.1.0"
description = "Local-first invoice to XRechnung candidate XML converter"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
pdf = ["pymupdf>=1.24"]
docx = ["python-docx>=1.1"]

[project.scripts]
xrechnung-converter = "xrechnung_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
