name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run browser helper tests
        run: node tests/webapp.test.js
      - name: Check browser privacy boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('web/app.js').read_text()
          banned = ['localStorage', 'sessionStorage', 'indexedDB', 'fetch(', 'XMLHttpRequest', 'new WebSocket', 'sendBeacon']
          found = [token for token in banned if token in source]
          if found:
              raise SystemExit(f'privacy boundary violation: {found}')
          print('privacy static check ok')
          PY
