name: Validator failure
about: Report a KoSIT, Mustangproject, veraPDF, or browser-validation failure using anonymized data only.
title: "validator: "
labels: [validation, needs-kosit-fixture]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please use only synthetic or anonymized invoice data.
        Do not paste real Leitweg-IDs, customer data, order numbers, IBANs, tax IDs, or private validator reports.
  - type: dropdown
    id: validator
    attributes:
      label: Validator / check
      options:
        - KoSIT XRechnung validator
        - Browser sanity validation
        - Mustangproject
        - veraPDF
        - Peppol / other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Validator and artifact versions
      description: |
        Example: KoSIT validator 1.6.2 + XRechnung config 2026-01-31
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Invoice format
      options:
        - XRechnung UBL
        - XRechnung CII
        - Generic EN16931 UBL
        - ZUGFeRD PDF/A-3
        - Factur-X PDF/A-3
        - Unknown / other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste only anonymized error text or a reduced synthetic fixture.
      render: text
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction command or browser steps
      placeholder: |
        python3 -m pytest ...
        xrechnung-converter examples/... --kosit-validator ...
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed or replaced real invoice/customer/order/bank/tax/Leitweg-ID data.
          required: true
        - label: I understand generated artifacts are candidates unless official validation passes.
          required: true
